[package]
name = "tiksee"
version = "0.3.0"
description = "TikSee — TikTok LIVE streamer companion"
authors = ["Dragos Catalin Vladulescu"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "tiksee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[target."cfg(windows)".dependencies]
window-vibrancy = "0.6"
keyring = { version = "3", features = ["windows-native"] }
libloading = "0.8"
# Loopback binary WebSocket for virtual-camera frames (raw IPC measured ~200 ms/frame).
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tiksee-vcam-shared = { path = "vcam/shared" }
windows = { version = "0.62", features = [
	"Devices_Bluetooth",
	"Devices_Bluetooth_Advertisement",
	"Devices_Bluetooth_GenericAttributeProfile",
	"Devices_Enumeration",
	"Foundation",
	"Foundation_Collections",
	"Storage_Streams",
	"Win32_Devices_DeviceAndDriverInstallation",
	"Win32_Foundation",
	"Win32_Storage_FileSystem",
	"Win32_Security",
	"Win32_System_Registry",
	"Win32_System_Threading",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
