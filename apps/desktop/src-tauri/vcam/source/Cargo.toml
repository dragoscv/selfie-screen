[package]
name = "tiksee-vcam-source"
version = "0.5.1"
description = "TikSee Camera: Frame Server custom media source (tiksee_vcam.dll)"
authors = ["Dragos Catalin Vladulescu"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "tiksee_vcam"
crate-type = ["cdylib"]

[dependencies]
tiksee-vcam-shared = { path = "../shared" }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
]
