# Every version here was verified against the npm registry on 2026-10-04
# (`npm view <pkg> version`, each published > 24 h ago).
# Bump in this catalog ONCE; packages reference `catalog:`.
packages:
  - "apps/desktop"
  - "apps/sidecar"
  - "packages/*"

# Supply-chain quarantine: never resolve a version younger than 24 h.
minimumReleaseAge: 1440

# pnpm 11+ ignores `onlyBuiltDependencies`; unlisted build scripts fail the
# install. esbuild powers Vite's esbuild minifier; @napi-rs/canvas and
# serialport are the sidecar's native deps; the Tauri CLI unpacks its binary.
strictDepBuilds: true
allowBuilds:
  esbuild: true
  "@tauri-apps/cli": true
  "@napi-rs/canvas": true
  serialport: true
  "@serialport/bindings-cpp": true

catalog:
  # --- core runtime ---
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # TS 7 dual install: `typescript` is the TS 6 JS API that typescript-eslint
  # and tsdown load (typescript-eslint peers on <6.1); `@typescript/native` is
  # TS 7 and provides the `tsc` binary used by every typecheck script.
  typescript: npm:@typescript/typescript6@^6.0.2
  "@typescript/native": npm:typescript@^7.0.2
  zod: 4.6.5

  # --- build / test ---
  vite: 8.3.2
  "@vitejs/plugin-react": 6.1.1
  vitest: 5.0.3
  tsdown: 0.23.0

  # --- styling ---
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  lucide-react: 1.51.0
  tw-animate-css: 1.4.0

  # --- state / data ---
  zustand: 5.0.15
  "@tanstack/react-virtual": 3.14.13

  # --- ui ---
  motion: 14.0.0
  sonner: 2.0.8
  cmdk: 1.1.1
  recharts: 3.10.1
  react-resizable-panels: 4.14.2
  "@number-flow/react": 0.6.2
  "@radix-ui/react-dialog": 1.1.23
  "@radix-ui/react-slider": 1.4.7
  "@radix-ui/react-switch": 1.3.7
  "@radix-ui/react-tabs": 1.1.21
  "@radix-ui/react-tooltip": 1.2.16
  "@radix-ui/react-slot": 1.3.3
  "@radix-ui/react-scroll-area": 1.2.18
  "@radix-ui/react-dropdown-menu": 2.1.24
  "@radix-ui/react-popover": 1.1.23
  "@radix-ui/react-select": 2.3.7
  "@radix-ui/react-separator": 1.1.15
  "@radix-ui/react-label": 2.1.15

  # --- i18n / format ---
  i18next: 26.4.2
  react-i18next: 17.0.15

  # --- tauri ---
  "@tauri-apps/api": 2.12.1
  "@tauri-apps/cli": 2.12.1
  "@tauri-apps/plugin-dialog": 2.8.1
  "@tauri-apps/plugin-opener": 2.7.0
  "@tauri-apps/plugin-shell": 2.4.0
  "@tauri-apps/plugin-store": 2.5.0
  "@tauri-apps/plugin-notification": 2.5.1
  "@tauri-apps/plugin-global-shortcut": 2.4.0
  "@tauri-apps/plugin-autostart": 2.7.0
  "@tauri-apps/plugin-window-state": 2.5.0
  "@tauri-apps/plugin-process": 2.4.0
  "@tauri-apps/plugin-log": 2.10.0

  # --- sidecar (node) ---
  ws: 8.22.0
  "@types/ws": 8.18.2
  tiktok-live-connector: 2.5.0
  serialport: 13.0.0
  "@napi-rs/canvas": 1.0.10
  obs-websocket-js: 5.0.8
  tsx: 4.23.15
  "@types/node": 24.19.1

  # --- lint ---
  eslint: 10.12.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.71.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.13.0
